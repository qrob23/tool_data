name: Temp Split Lines and Faceoffs By Team

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::arrow
            any::dplyr
            any::purrr

      - name: Split parquet files
        shell: Rscript {0}
        run: |
          library(arrow)
          library(dplyr)
          library(purrr)

          write_team_files <- function(df, season_id, dataset_name) {

            df <- df %>%
              mutate(teamId = as.integer(teamId))

            season_dir <- file.path("Data", season_id)

            dir.create(
              season_dir,
              recursive = TRUE,
              showWarnings = FALSE
            )

            split(df, df$teamId) |>
              iwalk(function(team_df, team_id) {

                team_dir <- file.path(
                  season_dir,
                  paste0("team_", team_id)
                )

                dir.create(
                  team_dir,
                  recursive = TRUE,
                  showWarnings = FALSE
                )

                write_parquet(
                  team_df,
                  file.path(
                    team_dir,
                    paste0(dataset_name, ".parquet")
                  )
                )

                message(
                  "Wrote ",
                  dataset_name,
                  " for season ",
                  season_id,
                  ", team ",
                  team_id,
                  " (",
                  nrow(team_df),
                  " rows)"
                )
              })
          }


          # ---------------- 2024-2025 ----------------

          lines_2425 <- read_parquet(
            "lines_2425.parquet"
          )

          faceoffs_2425 <- read_parquet(
            "faceoffs_2425.parquet"
          )

          write_team_files(
            lines_2425,
            "20242025",
            "lines"
          )

          write_team_files(
            faceoffs_2425,
            "20242025",
            "line_deployments"
          )


          # ---------------- 2025-2026 ----------------

          lines_2526 <- read_parquet(
            "lines_2526.parquet"
          )

          faceoffs_2526 <- read_parquet(
            "faceoffs_2526.parquet"
          )

          write_team_files(
            lines_2526,
            "20252026",
            "lines"
          )

          write_team_files(
            faceoffs_2526,
            "20252026",
            "line_deployments"
          )

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Data/20242025 Data/20252026
          git status --short

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Split lines and faceoffs by season and team"
            git push
          fi

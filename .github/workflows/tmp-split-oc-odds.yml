name: Temp Split Player Props Open Close

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-playerprops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            arrow
            dplyr
            purrr

      - name: Split player props parquet
        shell: Rscript {0}
        run: |
          library(arrow)
          library(dplyr)
          library(purrr)

          playerprops <- read_parquet(
            "playerprops_open-close_24-26.parquet"
          ) %>%
            mutate(
              seasonId = as.character(seasonId),
              teamId = as.integer(teamId)
            ) %>%
            filter(
              !is.na(seasonId),
              !is.na(teamId)
            )

          groups <- playerprops %>%
            distinct(
              season_id = seasonId,
              team_id = teamId
            ) %>%
            arrange(
              season_id,
              team_id
            )

          message(
            "Found ",
            nrow(groups),
            " season/team combinations."
          )

          pwalk(
            groups,
            function(season_id, team_id) {

              team_data <- playerprops %>%
                filter(
                  seasonId == .env$season_id,
                  teamId == .env$team_id
                )

              team_dir <- file.path(
                "Data",
                season_id,
                paste0("team_", team_id)
              )

              dir.create(
                team_dir,
                recursive = TRUE,
                showWarnings = FALSE
              )

              output_file <- file.path(
                team_dir,
                "playerprops_oc.parquet"
              )

              write_parquet(
                team_data,
                output_file,
                compression = "zstd"
              )

              message(
                "Wrote ",
                nrow(team_data),
                " rows -> ",
                output_file
              )
            }
          )

      - name: Commit split player props files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Data
          git status --short

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Split player props open-close by season and team"
            git push
          fi

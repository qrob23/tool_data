name: Split Game Rosters By Team

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-game-rosters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::arrow
            any::dplyr
            any::purrr

      - name: Split game roster parquet
        shell: Rscript {0}
        run: |
          library(arrow)
          library(dplyr)
          library(purrr)

          season_dir <- file.path("Data", "20252026")

          dir.create(
            season_dir,
            recursive = TRUE,
            showWarnings = FALSE
          )

          game_rosters <- read_parquet("game_rosters20252026.parquet") %>%
            mutate(teamId = as.integer(teamId))

          split(game_rosters, game_rosters$teamId) |>
            iwalk(function(team_df, team_id) {

              team_dir <- file.path(
                season_dir,
                paste0("team_", team_id)
              )

              dir.create(
                team_dir,
                recursive = TRUE,
                showWarnings = FALSE
              )

              write_parquet(
                team_df,
                file.path(team_dir, "game_rosters.parquet")
              )

              message(
                "Wrote game_rosters for team ",
                team_id,
                " (",
                nrow(team_df),
                " rows)"
              )
            })

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"

          git add Data/20252026

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Split 20252026 game rosters by team"
            git push
          fi

name: Split Rosters By Team

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-rosters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::arrow
            any::dplyr
            any::purrr

      - name: Split roster parquet file
        shell: Rscript {0}
        run: |
          library(arrow)
          library(dplyr)
          library(purrr)

          season_dir <- file.path("Data", "20242025")
          dir.create(season_dir, recursive = TRUE, showWarnings = FALSE)

          roster <- read_parquet("rosters20242025.parquet") %>%
            mutate(teamId = as.integer(teamId))

          split(roster, roster$teamId) |>
            iwalk(function(team_df, team_id) {
              team_dir <- file.path(season_dir, paste0("team_", team_id))
              dir.create(team_dir, recursive = TRUE, showWarnings = FALSE)

              write_parquet(
                team_df,
                file.path(team_dir, "roster.parquet")
              )

              message("Wrote roster for team ", team_id, " (", nrow(team_df), " rows)")
            })

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Data/20242025

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Split 20242025 roster file by team"
            git push
          fi
